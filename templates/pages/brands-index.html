<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Brands | BeiLuo Distributor</title>
  <meta name="description" content="Browse all authorized electronic component brands at BeiLuo. Power, MCU, analog, memory, sensors, passive components and more.">
  <meta name="keywords" content="electronic components, brands, distributors, Infineon, Semikron, ST, TI, ADI">
  
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/navbar.css">
  <link rel="stylesheet" href="/assets/css/footer.css">
  <link rel="stylesheet" href="/assets/css/breadcrumb.css">
  <link rel="stylesheet" href="/assets/css/floating-contact.css">
  
  <style>
    /* Page hero banner (matches About page) */
    .page-hero {
      background: linear-gradient(135deg, var(--primary-blue) 0%, var(--primary-blue-dark) 100%);
      color: #ffffff;
      padding: var(--space-16) 0;
      text-align: center;
      margin-bottom: var(--space-12);
    }
    .page-hero h1 { font-size: 2.5rem; color: #ffffff; margin-bottom: var(--space-4); }
    .page-hero p { font-size: 1.125rem; color: rgba(255,255,255,0.9); max-width: 800px; margin: 0 auto; }

    .brands-page { padding: 0 0 var(--space-16); }
    
    .brands-filter { display: flex; justify-content: center; gap: var(--space-2); margin-bottom: var(--space-8); flex-wrap: wrap; }
    .filter-btn {
      padding: 8px 20px;
      border-radius: var(--radius-full);
      background: var(--bg-light);
      color: var(--text-medium);
      border: none;
      cursor: pointer;
      font-size: 0.875rem;
      transition: all 0.2s ease-out;
    }
    .filter-btn:hover, .filter-btn.active { background: var(--primary-blue); color: #ffffff; }
    
    .brands-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-6); }
    
    .brand-card {
      background: #ffffff;
      border-radius: var(--radius-lg);
      padding: var(--space-6);
      text-align: center;
      box-shadow: var(--shadow-md);
      transition: all 0.3s ease-out;
      text-decoration: none;
      color: inherit;
    }
    .brand-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-xl); }
    .brand-logo { height: 80px; margin-bottom: var(--space-4); }
    .brand-card h3 { font-size: 1.125rem; color: var(--primary-blue); margin-bottom: var(--space-2); }
    .brand-card p { color: var(--text-medium); font-size: 0.875rem; margin-bottom: var(--space-4); }
    .brand-products { font-size: 0.75rem; color: var(--text-light); }
    
    @media (max-width: 1023px) { .brands-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 767px) { .brands-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 480px) { .brands-grid { grid-template-columns: 1fr; } }
  </style>
  <link rel="canonical" href="https://ic-distributor.com/brands/">
  <meta name="robots" content="index, follow">
</head>
<body>
  <!-- 导航栏 -->
  <!--#include virtual="/templates/components/navbar.html" -->

  <!-- 面包屑导航 -->
  <!--#include virtual="/templates/components/breadcrumb.html" -->
  
  <main>
    <section class="page-hero">
      <div class="container">
        <h1>All Brands</h1>
        <p>Browse our comprehensive portfolio of electronic component manufacturers</p>
      </div>
    </section>

    <section class="brands-page">
      <div class="container">
        <div class="brands-filter">
          <button class="filter-btn active" data-category="all">All</button>
          <% categories.forEach(function(cat) { %>
          <button class="filter-btn" data-category="<%= cat.id %>"><%= cat.name %></button>
          <% }); %>
          <button class="filter-btn" data-category="other">Other</button>
        </div>

        <div class="brands-grid">
          <% brands.forEach(function(b) { %>
          <a href="/<%= b.slug %>/" class="brand-card" data-category="<%= b.categories %>">
            <svg class="brand-logo" viewBox="0 0 200 80" aria-hidden="true"><rect fill="#f0f0f0" width="200" height="80"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-size="18" font-weight="bold" fill="#0072ce"><%= b.name %></text></svg>
            <h3><%= b.displayName %></h3>
            <p><%= b.tagline %></p>
            <div class="brand-products"><%= b.products %></div>
          </a>
          <% }); %>
        </div>
      </div>
    </section>
  </main>

  <script>
    // Brand filter Tab functionality (supports multiple categories per card)
    document.addEventListener('DOMContentLoaded', function() {
      const filterBtns = document.querySelectorAll('.brands-filter .filter-btn');
      const brandCards = document.querySelectorAll('.brands-grid .brand-card');

      filterBtns.forEach(btn => {
        btn.addEventListener('click', function() {
          filterBtns.forEach(b => b.classList.remove('active'));
          this.classList.add('active');

          const category = this.dataset.category;

          brandCards.forEach(card => {
            const cats = (card.dataset.category || '').split(' ');
            if (category === 'all' || cats.indexOf(category) !== -1) {
              card.style.display = 'block';
            } else {
              card.style.display = 'none';
            }
          });
        });
      });
    });
  </script>
  
  <!-- 页脚 -->
  <!--#include virtual="/templates/components/footer.html" -->

  <!-- 悬浮联系方式 -->
  <!--#include virtual="/templates/components/floating-contact.html" -->

  <script src="/assets/js/navbar.js"></script>
</body>
</html>
